# Deploys the API to Azure Container Apps.
#
# Moved off Cloud Run on 2026-08-02, for one blocking reason: Cloud Run has no
# stable outbound IP, so it could never be allowed through the Azure SQL
# firewall without paying for Cloud NAT. Being in Azure also removes the
# cross-cloud round-trip on every query, and makes the serverless database's
# wake-up far less visible.
#
# The image goes to GitHub Container Registry rather than Azure Container
# Registry: ghcr.io is free for this repository, ACR Basic is not.
#
# Needs:
#   secrets.AZURE_CREDENTIALS  -> service principal JSON (az ad sp create-for-rbac --sdk-auth)
#   secrets.AZURE_SQL_CONNECTION
#   vars.AZURE_RESOURCE_GROUP
name: Deploy API to Azure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/api-deploy.yml"

env:
  APP: fantasy-warrior-api
  ENVIRONMENT: fantasy-warrior-env
  SQL_SERVER: fantasywarrior
  IMAGE: ghcr.io/${{ github.repository }}/api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # `run:` steps use `bash -e`, so a plain `[ test ] && assign` that happens
      # to be false fails the step. Explicit ifs, deliberately.
      - name: Check the required secrets and variables are set
        run: |
          MISSING=""
          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ]; then MISSING="$MISSING AZURE_CREDENTIALS(secret)"; fi
          if [ -z "${{ secrets.AZURE_SQL_CONNECTION }}" ]; then MISSING="$MISSING AZURE_SQL_CONNECTION(secret)"; fi
          if [ -z "${{ vars.AZURE_RESOURCE_GROUP }}" ]; then MISSING="$MISSING AZURE_RESOURCE_GROUP(variable)"; fi
          if [ -n "$MISSING" ]; then
            echo "::error::Missing:$MISSING -- see .claude/doc/deployment.md"
            exit 1
          fi
          echo "All three present."

      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          IMAGE_TAG="${{ env.IMAGE }}:${{ github.sha }}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          docker build -f backend/FantasyWarrior.Api/Dockerfile -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install the Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      # A subscription that has never run Container Apps has these namespaces
      # unregistered. The containerapp extension tries to register them itself
      # and, when it cannot, crashes inside its own error formatting with
      # "Replacement index 1 out of range for positional args tuple" -- which
      # says nothing about what actually went wrong. Hence checking here first.
      #
      # Registering is a *subscription*-level operation, and this service
      # principal is scoped to one resource group, so it will usually not have
      # the right. That is fine and expected: the fix is a one-time command an
      # owner runs, and this step says exactly which.
      # Advisory, never fatal. Reading provider state is itself a
      # subscription-level call, so a resource-group-scoped principal cannot
      # tell "not registered" apart from "not allowed to look" -- blocking on
      # that would reject a subscription that is perfectly fine.
      #
      # If they really are unregistered, the deploy below fails and this warning
      # is sitting right above it saying what to do.
      - name: Note the resource providers (advisory)
        continue-on-error: true
        run: |
          for NS in Microsoft.App Microsoft.OperationalInsights; do
            STATE=$(az provider show --namespace "$NS" --query registrationState -o tsv 2>/dev/null || echo "cannot read")
            echo "$NS: $STATE"
            if [ "$STATE" != "Registered" ]; then
              az provider register --namespace "$NS" --wait 2>/dev/null && echo "  registered just now" || true
              echo "::warning::$NS reads as '$STATE'. If the deploy fails below, run this once in Azure Cloud Shell as an owner: az provider register --namespace $NS --wait"
            fi
          done

      # Read the region off the database rather than hardcoding it. Being in the
      # same region as the data is the entire reason the API is here, so it is
      # not something to keep in step by hand.
      - name: Use the database's region
        run: |
          LOCATION=$(az sql server show \
            --name "${{ env.SQL_SERVER }}" -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query location -o tsv)
          echo "Database region: $LOCATION"
          echo "LOCATION=$LOCATION" >> "$GITHUB_ENV"

      # Idempotent: creates the environment on the first run, no-ops after.
      - name: Ensure the Container Apps environment exists
        run: |
          az containerapp env show \
            --name "${{ env.ENVIRONMENT }}" -g "${{ vars.AZURE_RESOURCE_GROUP }}" >/dev/null 2>&1 \
          || az containerapp env create \
            --name "${{ env.ENVIRONMENT }}" -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --location "$LOCATION" --only-show-errors

      # Explicit create/update rather than `az containerapp up`. `up` is a
      # convenience wrapper that infers a lot -- it will happily invent a
      # resource group or try to build from source -- and when it goes wrong the
      # error rarely points at what it decided. These two are predictable.
      #
      # Registry credentials are passed even though the repository is public,
      # because a *package* on ghcr.io is private by default regardless of the
      # repository's visibility. Without them the pull fails with an
      # unauthorized error that reads like a missing image.
      #
      # Scale to zero keeps this inside the free grant: fourteen people do not
      # keep a container busy.
      - name: Create or update the app
        run: |
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"

          if az containerapp show --name "${{ env.APP }}" -g "$RG" >/dev/null 2>&1; then
            echo "Updating the existing app."
            # Refresh the secret first: the env var points at it by reference,
            # so it has to hold the current value before the new revision starts.
            az containerapp secret set --name "${{ env.APP }}" -g "$RG" \
              --secrets "sql-connection=${{ secrets.AZURE_SQL_CONNECTION }}" \
              --only-show-errors
            # `registry set` spells these --server/--username/--password, while
            # `create` below spells the same three --registry-*. Not a typo.
            az containerapp registry set --name "${{ env.APP }}" -g "$RG" \
              --server ghcr.io \
              --username "${{ github.actor }}" \
              --password "${{ secrets.GITHUB_TOKEN }}" \
              --only-show-errors
            az containerapp update --name "${{ env.APP }}" -g "$RG" \
              --image "$IMAGE_TAG" \
              --min-replicas 0 --max-replicas 2 \
              --set-env-vars "AZURE_SQL_CONNECTION=secretref:sql-connection" \
              --only-show-errors
          else
            echo "Creating the app."
            # Secret and env var in one call, so the app is never running
            # without a connection string.
            az containerapp create --name "${{ env.APP }}" -g "$RG" \
              --environment "${{ env.ENVIRONMENT }}" \
              --image "$IMAGE_TAG" \
              --target-port 8080 --ingress external \
              --min-replicas 0 --max-replicas 2 \
              --registry-server ghcr.io \
              --registry-username "${{ github.actor }}" \
              --registry-password "${{ secrets.GITHUB_TOKEN }}" \
              --secrets "sql-connection=${{ secrets.AZURE_SQL_CONNECTION }}" \
              --env-vars "AZURE_SQL_CONNECTION=secretref:sql-connection" \
              --only-show-errors
          fi

      # Container Apps environments have **stable** outbound IPs, which is the
      # one thing Cloud Run could not offer and the reason the API is here at
      # all. So the firewall rule can be derived rather than maintained: read
      # the app's own outbound addresses and allow exactly those.
      #
      # "Allow Azure services and resources to access this server" does *not*
      # cover this traffic -- the first deploy proved it, with SQL refusing the
      # app's IP by name.
      - name: Allow the app's outbound IPs through the SQL firewall
        run: |
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          IPS=$(az containerapp show --name "${{ env.APP }}" -g "$RG" \
            --query "properties.outboundIpAddresses" -o tsv)
          if [ -z "$IPS" ]; then
            echo "::warning::Could not read the app's outbound IPs; skipping the firewall rule."
            exit 0
          fi
          N=0
          for IP in $IPS; do
            N=$((N+1))
            echo "Allowing $IP"
            az sql server firewall-rule create \
              --resource-group "$RG" --server "${{ env.SQL_SERVER }}" \
              --name "containerapp-$N" \
              --start-ip-address "$IP" --end-ip-address "$IP" \
              --only-show-errors >/dev/null
          done
          echo "$N outbound IP(s) allowed. Azure SQL takes up to five minutes to apply this."

      # The hang that started this: TLS completes, nothing answers. Reporting
      # the revision's own view is far more useful than another timeout.
      - name: Report the revision's health
        run: |
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          echo "Waiting for the new revision to settle..."
          sleep 30
          az containerapp revision list --name "${{ env.APP }}" -g "$RG" \
            --query "[].{name:name, active:properties.active, state:properties.runningState, replicas:properties.replicas, created:properties.createdTime}" \
            -o table
          echo
          echo "=== last 40 console lines ==="
          az containerapp logs show --name "${{ env.APP }}" -g "$RG" \
            --type console --tail 40 2>&1 || echo "(no console logs yet)"

      - name: Report the URL
        run: |
          URL=$(az containerapp show --name "${{ env.APP }}" \
            -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "### API deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "https://$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Set the repository variable API_URL to this, then re-run the frontend deploy." >> "$GITHUB_STEP_SUMMARY"
