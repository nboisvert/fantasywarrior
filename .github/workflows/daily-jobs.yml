# Nightly data jobs: yesterday's boxscores, then scoring, then reference data.
# 09:30 UTC = after every NHL game is final, West Coast included.
#
# Requires the GitHub secret AZURE_SQL_CONNECTION. Nothing else.
#
# GitHub-hosted runners have dynamic IPs, but they are Azure VMs, so Azure SQL's
# "Allow Azure services and resources to access this server" setting covers
# them. That is the whole firewall story for this workflow.
#
# The optional steps below open and close a per-run firewall rule instead, for a
# runner that is not on Azure. They are skipped unless AZURE_RESOURCE_GROUP is
# set, which is the normal case.
name: Daily NHL data sync

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      from:
        description: "Backfill from (YYYY-MM-DD), default yesterday"
        required: false
      to:
        description: "Backfill to (YYYY-MM-DD), default yesterday"
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      AZURE_SQL_CONNECTION: ${{ secrets.AZURE_SQL_CONNECTION }}
      SQL_SERVER: fantasywarrior
      SQL_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Allow this runner through the SQL firewall
        if: ${{ env.SQL_RESOURCE_GROUP != '' }}
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          az login --service-principal \
            -u "${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}" \
            -p "${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}" \
            --tenant "${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}" > /dev/null
          az sql server firewall-rule create \
            --resource-group "$SQL_RESOURCE_GROUP" --server "$SQL_SERVER" \
            --name "gh-${{ github.run_id }}" \
            --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" > /dev/null

      # The schema must be current before anything writes to it.
      - name: Apply migrations
        run: dotnet run --project backend/FantasyWarrior.Jobs -c Release -- db-migrate

      - name: Stats sync
        run: |
          ARGS=""
          if [ -n "${{ inputs.from }}" ]; then ARGS="--from ${{ inputs.from }} --to ${{ inputs.to || inputs.from }}"; fi
          dotnet run --project backend/FantasyWarrior.Jobs -c Release -- stats-sync $ARGS

      # After stats-sync and before scoring, because both of the things it does
      # depend on the games that just landed: it appends any week the calendar
      # is still missing, and refreshes GameCount on the weeks it already has.
      # A season's calendar is built from its declared dates, so before its
      # schedule is imported every week reads as a break week -- this is what
      # makes those counts catch up. Boundaries are never moved.
      - name: Period calendar
        run: dotnet run --project backend/FantasyWarrior.Jobs -c Release -- period-init

      # One command on purpose: the order inside it -- score the current week,
      # bank finished weeks, then execute accepted trades effective next week --
      # is a correctness requirement, and as separate steps here nothing stopped
      # it being reordered.
      - name: Nightly scoring
        run: dotnet run --project backend/FantasyWarrior.Jobs -c Release -- nightly

      - name: Player sync
        run: dotnet run --project backend/FantasyWarrior.Jobs -c Release -- player-sync
      - name: Draft sync
        run: dotnet run --project backend/FantasyWarrior.Jobs -c Release -- draft-sync
      - name: News sync
        run: dotnet run --project backend/FantasyWarrior.Jobs -c Release -- news-sync

      - name: Remove the firewall rule
        if: ${{ always() && env.SQL_RESOURCE_GROUP != '' && env.RUNNER_IP != '' }}
        run: |
          az sql server firewall-rule delete \
            --resource-group "$SQL_RESOURCE_GROUP" --server "$SQL_SERVER" \
            --name "gh-${{ github.run_id }}" || true
