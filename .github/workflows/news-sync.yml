# Standalone news sync — separate from daily-jobs.yml's full nightly chain
# so Rotowire/FantasySP feed changes can be tested/rerun without also
# re-running stats-sync/score-calc/process-trades/player-sync/draft-sync.
# The nightly chain in daily-jobs.yml still runs news-sync every day too;
# this is for on-demand runs and quick feed-URL overrides while debugging.
name: News sync

on:
  workflow_dispatch:
    inputs:
      rotowireUrl:
        description: "Override Rotowire RSS feed URL (optional)"
        required: false
      rotowireInjuriesUrl:
        description: "Override Rotowire injuries page URL to scrape (optional, not a feed)"
        required: false
      fantasySpUrl:
        description: "Override FantasySP injuries page URL to scrape (optional, not a feed)"
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      AZURE_SQL_CONNECTION: ${{ secrets.AZURE_SQL_CONNECTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: News sync
        run: |
          ARGS=""
          if [ -n "${{ inputs.rotowireUrl }}" ]; then ARGS="$ARGS --rotowire-url ${{ inputs.rotowireUrl }}"; fi
          if [ -n "${{ inputs.rotowireInjuriesUrl }}" ]; then ARGS="$ARGS --rotowire-injuries-url ${{ inputs.rotowireInjuriesUrl }}"; fi
          if [ -n "${{ inputs.fantasySpUrl }}" ]; then ARGS="$ARGS --fantasysp-url ${{ inputs.fantasySpUrl }}"; fi
          dotnet run --project backend/FantasyWarrior.Jobs -c Release -- news-sync $ARGS
